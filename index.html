<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- theme-color mirrors --bg of src/styles/tokens.css (meta cannot read CSS vars; allowlisted in scripts/check-tokens.allow.json) -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08213B" media="(prefers-color-scheme: dark)" />
    <!-- theme before first paint (no dark/light flash); same rule as src/lib/theme.ts applyTheme(): stored choice, else worker/foreman light, else navy dark -->
    <script>try{var p=localStorage.getItem("bp-theme"),r=localStorage.getItem("bp-theme-role");p=p==="light"||p==="dark"||p==="system"?p:(r==="worker"||r==="foreman"?"light":"dark");if(p!=="system"){document.documentElement.dataset.theme=p;document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.content=p==="dark"?"#08213B":"#FFFFFF"})}}catch(e){document.documentElement.dataset.theme="dark"}</script>
    <link rel="preload" href="/fonts/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter/inter-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="description" content="BuildProof — прозрачность строительных объектов: этапы, фото, задачи, замечания." />

    <!-- Static Open Graph / Twitter Card (pure client SPA, no SSR — one card for the whole site) -->
    <meta property="og:site_name" content="BuildProof" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="BuildProof — ваша стройка в вашем кармане" />
    <meta property="og:description" content="Прозрачность строительных объектов в реальном времени: прогресс по этапам, фото-подтверждения, открытые проблемы — без звонков прорабу." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://build-proof-three.vercel.app" />
    <meta property="og:image" content="https://build-proof-three.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="BuildProof — прозрачность строительных объектов в реальном времени" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BuildProof — ваша стройка в вашем кармане" />
    <meta name="twitter:description" content="Прозрачность строительных объектов в реальном времени." />
    <meta name="twitter:image" content="https://build-proof-three.vercel.app/og-image.png" />

    <title>BuildProof</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
